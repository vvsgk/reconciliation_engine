services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: reconciliation
      POSTGRES_PASSWORD: reconciliation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciliation -d reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  application:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reconciliation
      SPRING_DATASOURCE_USERNAME: reconciliation
      SPRING_DATASOURCE_PASSWORD: reconciliation
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
